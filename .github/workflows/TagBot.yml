name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: How many days back to look for untagged releases.
        default: '3'

# TagBot creates the tag and the GitHub release, so it needs write access to
# contents (the repository's default token is read-only).
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # Gate on the actor, not the comment body: anyone can post an issue
    # comment, and this job holds a write token.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Optional: an SSH key so the tag push triggers tag-gated workflows;
          # unset, TagBot falls back to the token above.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # Forwarded, so the dispatch input above is not a knob that does
          # nothing. Empty on an `issue_comment` run, where it falls back to
          # the action's own default of 3.
          lookback: ${{ inputs.lookback || 3 }}
